{% extends 'base.html' %}{% block content %}<section class="panel"><h1>Secure gateway checkout</h1><p>Order {{ order.order_no }} · ₹{{ order.total|rupees }}</p><button id="pay" class="btn primary">Open Cashfree checkout</button><p class="muted">After payment, return to the order page. Payment is confirmed only by a verified gateway webhook.</p></section><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><script>const cashfree=Cashfree({mode:{{ ('production' if cf_env == 'production' else 'sandbox')|tojson }}});document.getElementById('pay').onclick=()=>cashfree.checkout({paymentSessionId:{{ payment_session_id|tojson }},redirectTarget:'_self'});</script>{% endblock %}
